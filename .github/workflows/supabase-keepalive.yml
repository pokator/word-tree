# Supabase pauses a Free plan project after a week of low database activity,
# which takes sign-in and account sync down until someone resumes it by hand.
# A few reads a day is typically enough to prevent that. A failed run is the
# alert: GitHub emails whoever last changed this schedule.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from the database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          rows=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --retry-delay 20 --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/words?select=word&limit=1")
          if [ "$rows" = "[]" ]; then
            echo "::error::The words table returned no rows"
            exit 1
          fi

      # GitHub disables schedules on public repos after 60 days without
      # repository activity, which would silently end these pings.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable supabase-keepalive.yml
