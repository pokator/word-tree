    <noscript>
      <main style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: sans-serif">
        <h1>Moto (元) — explore Japanese vocabulary as a web of kanji</h1>
        <p>
          Moto is a free, interactive Japanese dictionary. Type any word — 学校, 日本語, 天気 —
          and it opens into the kanji it's built from; each kanji opens into every other word
          that shares it. Around 228,000 words from JMdict and 13,000 kanji from KANJIDIC2,
          with readings, meanings, JLPT levels, and on'yomi/kun'yomi for every link.
        </p>
        <p>
          Bookmark the words you want to learn and Moto turns them into Anki cards, tagged by
          kanji, JLPT level, and where you found them.
        </p>
        <p>Moto needs JavaScript to draw its word graph. Browse the <a href="/kanji">2,136 jōyō kanji</a> without it.</p>
      </main>
    </noscript>
